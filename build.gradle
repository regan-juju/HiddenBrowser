buildscript {
    ext.kotlinVersion = '1.7.21'
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:7.4.2'
        classpath 'com.getkeepsafe.dexcount:dexcount-gradle-plugin:3.0.1'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion"
        classpath 'com.github.ben-manes:gradle-versions-plugin:0.42.0'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        // Several small, single-author dependencies below (anthonycr's
        // mezzanine/grant/progress libraries, net.i2p) were only ever
        // published to jcenter, which shut down in 2021. JitPack can
        // build them straight from their GitHub source as a fallback.
        maven { url 'https://jitpack.io' }
    }
}

ext {
    minSdkVersion = 19
    targetSdkVersion = 29
    buildToolsVersion = '30.0.3'
}

org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1024m
kotlin.incremental=false
android.useAndroidX=true
android.enableJetifier=true
# ButterKnife's @BindView(R.id....) needs R.id fields to stay compile-time
# constants, which AGP 8's default of non-final resource IDs breaks.
android.nonFinalResIds=false

# TODO: Remove when I2P 0.9.41 or later is available via maven
I2P_VERSION=0.9.41
ANDROID_BUILD_TARGET_SDK_VERSION=28
ANDROID_BUILD_SDK_VERSION=28
